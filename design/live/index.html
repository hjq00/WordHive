<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轻词 · 模拟器实时画面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px;
    background: #f0f2ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #16201b;
  }
  .frame {
    position: relative;
    width: 300px; max-width: 100%;
    aspect-ratio: 1080 / 2400;
    border-radius: 34px;
    background: #0d1512;
    padding: 9px;
    box-shadow: 0 1px 2px rgba(22,32,27,.08), 0 20px 44px -26px rgba(22,32,27,.5), 0 0 0 1px rgba(22,32,27,.06);
  }
  .frame img {
    width: 100%; height: 100%;
    border-radius: 26px;
    display: block;
    object-fit: cover;
    background: #16201b;
  }
  .bar {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; color: #8a948d;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #2c6a52; }
  .dot.off { background: #b04f49; }
  .tag {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: #e6f0ea; color: #1e4c3a;
  }
</style>
</head>
<body>
  <div class="frame"><img id="shot" alt="模拟器实时画面" src="screen.png"></div>
  <div class="bar">
    <span class="dot" id="dot"></span>
    <span id="status">连接中…</span>
    <span class="tag">emulator-5554 · Android 15</span>
  </div>
<script>
  const img = document.getElementById('shot');
  const dot = document.getElementById('dot');
  const statusEl = document.getElementById('status');
  let ok = false;

  async function refresh() {
    const url = 'screen.png?t=' + Date.now();
    try {
      await new Promise((res, rej) => {
        const probe = new Image();
        probe.onload = res;
        probe.onerror = rej;
        probe.src = url;
      });
      img.src = url;
      ok = true;
      dot.className = 'dot';
      statusEl.textContent = '实时 · ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    } catch (e) {
      ok = false;
      dot.className = 'dot off';
      statusEl.textContent = '未连接（等待截图）';
    }
  }
  refresh();
  setInterval(refresh, 1500);
</script>
</body>
</html>
